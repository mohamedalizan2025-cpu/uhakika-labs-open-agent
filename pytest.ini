[pytest]
# Warning policy (Phase 8 reproducibility): promote our own UserWarnings (e.g.
# Pydantic v2 migration smells) to errors so regressions fail the build, but do
# NOT fail on a transitive's deprecation that is outside our control. Starlette's
# TestClient emits StarletteDeprecationWarning (a UserWarning subclass) on import
# depending on the resolved httpx/httpx2 combo; ignoring that class keeps a clean
# clone green while still catching real first-party warnings.
filterwarnings =
    error::UserWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
