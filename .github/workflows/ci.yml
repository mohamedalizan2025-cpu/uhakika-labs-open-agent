name: CI

# Credential-free reproducibility gate (BUILD_PLAN Phase 8):
# - Backend: install pinned deps and run the pytest suite (sample mode needs no
#   credentials and never reads .env).
# - Frontend: clean install from the lockfile and type-check + production build.
# No secrets are referenced; the workflow must pass on a fresh clone with an
# empty environment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (credential-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — no committed .env
        run: |
          if [ -f .env ]; then
            echo "::error::.env must never be committed; the app reads os.environ only."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # No env vars are set: tests derive sample mode and settings internally.
        run: python -m pytest -q -W error::UserWarning

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install from lockfile
        run: npm ci

      - name: Type-check and build
        run: npm run build
