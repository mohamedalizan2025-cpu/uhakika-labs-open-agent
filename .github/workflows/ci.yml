name: CI

# Credential-free reproducibility gate:
# - Backend: install pinned deps and run the pytest suite.
# - Frontend: clean install from lockfile, run Vitest, type-check + production build.
# No secrets are referenced; the workflow must pass on a fresh clone with an
# empty environment. (.env is Git-ignored and loaded only by the app runtime,
# never by CI or the AI/operator.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (credential-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Guard — no committed .env
        run: |
          if [ -f .env ]; then
            echo "::error::.env must never be committed; the app loads it only at local runtime via python-dotenv."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # No env vars are set: tests derive sample mode/settings internally.
        # Warning policy (UserWarnings->errors, ignore the starlette transitive
        # deprecation) lives in pytest.ini so local and CI behave identically.
        run: python -m pytest -q

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install from lockfile
        run: npm ci

      - name: Runtime tests (Vitest)
        run: npm run test:run

      - name: Type-check and build
        run: npm run build
